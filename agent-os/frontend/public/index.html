<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0e14" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>Agent OS</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: #0b0e14; color: #e6e9ef; }
    header { padding: 12px 16px; border-bottom: 1px solid #1e2430; display: flex; gap: 12px; align-items: center; }
    header h1 { font-size: 16px; margin: 0; flex: 1; }
    #log { padding: 16px; height: calc(100dvh - 190px); overflow-y: auto; }
    .msg { margin: 8px 0; padding: 10px 12px; border-radius: 10px; max-width: 85%; white-space: pre-wrap; }
    .user { background: #1b3a5b; margin-left: auto; }
    .agent { background: #161b26; }
    .sys { color: #8a93a6; font-size: 13px; }
    footer { position: fixed; bottom: 0; left: 0; right: 0; padding: 12px; padding-bottom: max(12px, env(safe-area-inset-bottom));
             background: #0b0e14; border-top: 1px solid #1e2430; display: flex; gap: 8px; }
    input, button { font: inherit; border-radius: 10px; border: 1px solid #2a3140; }
    #text { flex: 1; padding: 10px 12px; background: #11151d; color: #e6e9ef; }
    button { padding: 10px 14px; background: #2563eb; color: #fff; border: none; cursor: pointer; }
    #talk.rec { background: #dc2626; }
    .toggle { background: #11151d; color: #e6e9ef; border: 1px solid #2a3140; }
    .toggle.on { background: #16a34a; border-color: #16a34a; }
  </style>
</head>
<body>
  <header>
    <h1>Agent OS</h1>
    <button id="voice" class="toggle on" title="Sprachausgabe">🔊 Voice</button>
  </header>
  <div id="log"></div>
  <footer>
    <button id="talk" title="Push-to-talk">🎙️</button>
    <input id="text" placeholder="Nachricht… (oder 🎙️ halten)" autocomplete="off" />
    <button id="send">➤</button>
  </footer>
  <script src="/app.js"></script>
</body>
</html>
